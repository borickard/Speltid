<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Speltid</title>
    <meta name="description" content="Speltid — matchplanerare för ungdomsfotboll. Planera byten, positioner och speltid med jämn fördelning." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- PWA — installable to home screen on iOS and Android -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Speltid" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Speltid" />
    <meta property="og:description" content="Matchplanerare för ungdomsfotboll. Jämna byten, tydliga positioner, rättvis speltid." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Speltid" />
    <meta name="twitter:description" content="Matchplanerare för ungdomsfotboll. Jämna byten, tydliga positioner, rättvis speltid." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="theme-color" content="#facc15" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; overflow-x: hidden; background: #ffffff; }
      input, button { min-width: 0; font-family: inherit; }
      /* Prevent iOS Safari from auto-zooming on focus when input font-size < 16px */
      @media (max-width: 768px) {
        input, select, textarea { font-size: 16px !important; }
      }
      /* Flash both chips when a manual swap commits, so it reads as a
         movement rather than a silent re-order of two names. */
      @keyframes swap-pulse {
        0%   { transform: scale(1);    box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.65); }
        30%  { transform: scale(1.18); box-shadow: 0 0 0 6px rgba(250, 204, 21, 0.35); }
        70%  { transform: scale(1.04); box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.15); }
        100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(250, 204, 21, 0);     }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
