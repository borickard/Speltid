<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .wm   { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; letter-spacing: -0.035em; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
  </defs>

  <!-- White canvas -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Yellow highlight stripe along the top -->
  <rect x="0" y="0" width="1200" height="10" fill="#facc15"/>

  <!-- Lockup: stopwatch + wordmark, optically centred -->
  <g transform="translate(228, 215)">
    <!-- Stopwatch (solid black body, yellow second hand toward 1:30, white centre dot) -->
    <g>
      <circle cx="78" cy="106" r="78" fill="#0a0a0a"/>
      <rect x="56" y="0" width="44" height="26" rx="5" fill="#0a0a0a"/>
      <line x1="78" y1="26" x2="78" y2="42" stroke="#0a0a0a" stroke-width="18" stroke-linecap="round"/>
      <line x1="78" y1="106" x2="116" y2="68" stroke="#facc15" stroke-width="22" stroke-linecap="round"/>
      <circle cx="78" cy="106" r="11" fill="#ffffff"/>
    </g>
    <!-- Wordmark baseline aligned to stopwatch body centre -->
    <text x="206" y="148" class="wm" font-size="200" fill="#0a0a0a">Speltid</text>
  </g>

  <!-- Supporting line, centred below the lockup -->
  <text x="600" y="430" class="mono" font-size="24" fill="#525252"
        text-anchor="middle" letter-spacing="2" font-weight="500">
    MATCHPLANERAREN · UNGDOMSFOTBOLL
  </text>

  <!-- Format row — three pills that explain what the tool covers -->
  <g transform="translate(600, 480)">
    <g transform="translate(-205, 0)">
      <rect x="0" y="0" width="120" height="52" rx="8" fill="#facc15" stroke="#0a0a0a" stroke-width="3"/>
      <text x="60" y="35" class="mono" font-size="22" fill="#0a0a0a" font-weight="700"
            text-anchor="middle" letter-spacing="2">3v3</text>
    </g>
    <g transform="translate(-60, 0)">
      <rect x="0" y="0" width="120" height="52" rx="8" fill="#facc15" stroke="#0a0a0a" stroke-width="3"/>
      <text x="60" y="35" class="mono" font-size="22" fill="#0a0a0a" font-weight="700"
            text-anchor="middle" letter-spacing="2">5v5</text>
    </g>
    <g transform="translate(85, 0)">
      <rect x="0" y="0" width="120" height="52" rx="8" fill="#facc15" stroke="#0a0a0a" stroke-width="3"/>
      <text x="60" y="35" class="mono" font-size="22" fill="#0a0a0a" font-weight="700"
            text-anchor="middle" letter-spacing="2">7v7</text>
    </g>
  </g>

  <!-- Domain tag in a corner for subtle credit -->
  <text x="1150" y="600" class="mono" font-size="18" fill="#a3a3a3"
        text-anchor="end" font-weight="500">speltid.halvlek.se</text>
</svg>
